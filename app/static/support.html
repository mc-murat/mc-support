<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IT-Support – Anfrage einreichen</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<header>
  <h1>IT-Support</h1>
</header>

<main>

  <!-- Confirmation screen (shown after submit) -->
  <div id="confirmation" class="card confirmation" style="display:none;">
    <div class="confirm-icon">&#10003;</div>
    <h2>Dein Ticket wurde erfasst.</h2>
    <p class="ticket-id-line">Ticket-ID: <strong id="ticket-id-display">#–</strong></p>
    <p class="confirm-sub">Die IT-Abteilung wurde informiert.<br>Du erhältst eine Rückmeldung so schnell wie möglich.</p>
    <button class="btn-secondary" onclick="showForm()">Weitere Anfrage einreichen</button>
  </div>

  <!-- Support form -->
  <div id="form-card" class="card">
    <h2>Neue Supportanfrage</h2>
    <p class="form-intro">Beschreibe dein Problem so genau wie möglich. Die IT kümmert sich darum.</p>

    <form id="support-form" action="/submit" method="post">
      <label for="user_name">Name / Kürzel</label>
      <input type="text" id="user_name" name="user_name"
             placeholder="z. B. Max Muster oder MMU" required />

      <label for="department">Abteilung</label>
      <input type="text" id="department" name="department"
             placeholder="z. B. Buchhaltung, HR, IT …" required />

      <label for="message">Problembeschreibung</label>
      <textarea id="message" name="message"
                placeholder="z. B. Ich kann mich seit heute nicht mehr mit dem VPN verbinden …"
                required></textarea>

      <button type="submit">Ticket einreichen</button>
    </form>
  </div>

</main>

<script>
  function showForm() {
    document.getElementById("confirmation").style.display = "none";
    document.getElementById("form-card").style.display = "block";
    // Clear form fields
    document.getElementById("support-form").reset();
    history.replaceState(null, "", "/support");
  }

  const params = new URLSearchParams(window.location.search);
  if (params.get("success") === "1") {
    const ticketId = params.get("id") ?? "–";
    document.getElementById("ticket-id-display").textContent = "#" + ticketId;
    document.getElementById("form-card").style.display = "none";
    document.getElementById("confirmation").style.display = "block";
  }
</script>

</body>
</html>
